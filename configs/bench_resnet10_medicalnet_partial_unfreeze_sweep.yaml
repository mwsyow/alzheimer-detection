# Rotating-test benchmark: MedicalNet ResNet10 partial-unfreezing screen.
# cv.random_seed is fixed so every architecture and model seed uses identical subject
# folds. Top-level seed controls initialization, data order, workers, and augmentation.
# Each trial rotates 3 train + 1 validation + 1 test fold, giving one OOF test
# prediction per subject. Run evaluate.py on each completed parent checkpoint directory
# to compute pooled OOF ROC-AUC and the remaining test metrics.

program: train.py
entity: wmarcellius123
project: alzheimer-detection
method: grid

metric:
  name: Best Validation AUC
  goal: maximize

parameters:
  seed:
    value: 42
  model.pretrained.freeze_backbone:
    value: true
  model.pretrained.unfreeze_last_stages:
    values: [0, 1, 2, 3, 4, 5]
  early_stopping.enabled:
    value: true
  early_stopping.patience:
    value: 20
  cv.strategy:
    value: rotating_test
  cv.n_splits:
    value: 5
  cv.random_seed:
    value: 42

command:
  - ${env}
  - uv
  - run
  - --no-dev
  - python
  - train.py
  - --config
  - configs/bench_resnet10_medicalnet.json
